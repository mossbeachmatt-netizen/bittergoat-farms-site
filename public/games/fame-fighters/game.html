const AC=new (window.AudioContext||window.webkitAudioContext)();
function tone(f,t,d,v,pe){try{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,AC.currentTime);if(pe)o.frequency.linearRampToValueAtTime(pe,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+0.01);}catch(e){}}

// ── Custom punch SFX (Web Audio API buffer) ────────────────
let punchBuffer = null;
(function() {
  const b64 = PUNCH_SFX_B64;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  AC.decodeAudioData(bytes.buffer).then(decoded=>{
    punchBuffer=decoded;
  }).catch(e=>console.warn('Punch decode failed:',e));
})();
function playPunchSFX() {
  if(!punchBuffer) return;
  try {
    const s=AC.createBufferSource();
    const g=AC.createGain();
    s.buffer=punchBuffer;
    g.gain.value=1.0;
    s.connect(g);
    g.connect(AC.destination);
    s.start(0);
  } catch(e) {}
}


// ── Title / Select screen music ───────────────────────────────
const bgMusic = new Audio(MUSIC_B64);
bgMusic.loop = true;
bgMusic.volume = 0.55;
let bgMusicPlaying = false;

function startBgMusic() {
  if(bgMusicPlaying) return;
  bgMusic.currentTime = 0;
  bgMusic.play().then(() => { bgMusicPlaying = true; }).catch(() => {});
}

function stopBgMusic() {
  if(!bgMusicPlaying) return;
  // Fade out over 600ms
  const fadeInterval = setInterval(() => {
    if(bgMusic.volume > 0.05) {
      bgMusic.volume = Math.max(0, bgMusic.volume - 0.05);
    } else {
      bgMusic.pause();
      bgMusic.currentTime = 0;
      bgMusic.volume = 0.55;
      bgMusicPlaying = false;
      clearInterval(fadeInterval);
    }
  }, 30);
}

const sfx={
  kick: ()=>{tone(100,'sawtooth',0.10,0.7,50);setTimeout(()=>tone(220,'square',0.06,0.3),90);},
  swing:()=>{tone(60,'sawtooth',0.08,0.4);setTimeout(()=>{tone(120,'sawtooth',0.25,0.8,40);tone(2000,'sine',0.05,0.1,100);},180);},
  punch:()=>{tone(180,'sawtooth',0.07,0.5);tone(350,'square',0.04,0.25);},
  block:()=>tone(700,'square',0.05,0.2,400),
  jump: ()=>tone(300,'sine',0.15,0.12,500),
  land: ()=>tone(100,'sawtooth',0.06,0.2,60),
  ko:   ()=>[0,110,220,340,460].forEach((t,i)=>setTimeout(()=>tone(100-i*12,'sawtooth',0.6,0.45),t)),
  win:  ()=>[0,150,300,500].forEach((t,i)=>{const n=[440,554,659,880][i];setTimeout(()=>tone(n,'square',0.3,0.25),t);}),
  tick: ()=>tone(800,'square',0.05,0.12),
  fight:()=>{tone(300,'square',0.08,0.35);setTimeout(()=>tone(600,'square',0.12,0.4),120);},
  cpuKick:()=>{tone(110,'sawtooth',0.12,0.6);tone(220,'square',0.06,0.3);},
};

const K={};
document.addEventListener('keydown',e=>{K[e.code]=true;if(['KeyW','KeyS','KeyA','KeyD','Space'].includes(e.code))e.preventDefault();AC.resume();if(gPhase==='title'||gPhase==='charselect')startBgMusic();if(e.code==='Enter'&&gPhase==='gameover')rematch(); if(e.code==='Enter'&&gPhase==='charselect'&&!gSelConfirmed){gSelConfirmed=true;gSelTimer=90;sfx.fight();}});
document.addEventListener('keyup',e=>K[e.code]=false);

// Start music on first click or touch (browser autoplay policy)
function firstInteraction() {
  AC.resume();
  if(gPhase==='title'||gPhase==='charselect')startBgMusic();
  document.removeEventListener('click', firstInteraction);
  document.removeEventListener('touchstart', firstInteraction);
}
document.addEventListener('click', firstInteraction);
document.addEventListener('touchstart', firstInteraction);

function p1Input(){return{left:!!K.KeyA,right:!!K.KeyD,jump:!!K.KeyW,block:!!K.KeyS,kick:!!K.KeyJ,swing:!!K.KeyK};}

let parts=[],floats=[];
function spawnHit(x,y,blk){const n=blk?6:22;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*(blk?2:7)+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:30+Math.random()*15,ml:45,col:blk?'#6699ff':(i%3===0?'#fff':i%3===1?'#ff6600':'#ffcc00'),r:Math.random()*5+2});}}
function addFloat(x,y,text,col){floats.push({x,y,text,col:col||'#FFD700',life:55,ml:55});}
function updateParts(){parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.vx*=0.9;p.life--;});parts=parts.filter(p=>p.life>0);}
function updateFloats(){floats.forEach(f=>{f.y-=1.2;f.life--;});floats=floats.filter(f=>f.life>0);}
function drawParts(){parts.forEach(p=>{ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.life/p.ml),0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}
function drawPartsWorld(){drawParts();}
function drawFloats(){floats.forEach(f=>{ctx.globalAlpha=Math.min(1,(f.life/f.ml)*2.5);ctx.fillStyle=f.col;ctx.font=`bold ${15+(1-f.life/f.ml)*4}px monospace`;ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);});ctx.globalAlpha=1;}
function drawFloatsScreenSpace(){floats.forEach(f=>{ctx.globalAlpha=Math.min(1,(f.life/f.ml)*2.5);ctx.fillStyle=f.col;ctx.font=`bold ${15+(1-f.life/f.ml)*4}px monospace`;ctx.textAlign='center';ctx.fillText(f.text,f.x-cameraX,f.y);});ctx.globalAlpha=1;}

class P1Fighter {
  constructor(x){this.name='CAT STEEL';this.wins=0;this.pal={acc:'#cc0000'};this.reset(x);}
  reset(x){this.x=x;this.y=GY;this.vy=0;this.hp=100;this.st='idle';this.fr=0;this.stTimer=0;this.onGnd=true;this.hitDone=false;this.flash=0;this.dir=1;this.sprFrame=0;this.activeSheet='kick';}
  get locked(){return['kick','swing','hurt','dead'].includes(this.st);}
  act(inp,opp){
    this.fr++;if(this.flash>0)this.flash--;
    if(this.stTimer>0&&--this.stTimer===0&&this.st!=='dead'){this.st='idle';this.hitDone=false;}
    if(!this.locked){
      const prevSt=this.st;
      this.dir=(this.x<opp.x)?1:-1;this.st='idle';
      if(inp.swing){this.st='swing';this.stTimer=48;this.hitDone=false;this.fr=0;sfx.swing();}
      else if(inp.kick){this.st='kick';this.stTimer=36;this.hitDone=false;this.fr=0;sfx.kick();}
      else if(inp.block&&this.onGnd){if(prevSt!=='block')this.fr=0;this.st='block';}
      else{if(inp.left){this.x-=4;if(this.onGnd)this.st='walk';}if(inp.right){this.x+=4;if(this.onGnd)this.st='walk';}}
      if(inp.jump&&this.onGnd){this.vy=-17;this.onGnd=false;this.st='jump';sfx.jump();}
    }
    if(this.st==='swing'){this.activeSheet='swing';this.sprFrame=Math.min(SWING_N-1,Math.floor(this.fr/6));}
    else if(this.st==='kick'){this.activeSheet='kick';this.sprFrame=Math.min(KICK_N-1,Math.floor(this.fr/6));}
    else if(this.st==='block'){this.activeSheet='block';this.sprFrame=Math.min(1,Math.floor(this.fr/6));}
    else if(this.st==='hurt'){this.activeSheet='block';this.sprFrame=1;}
    else if(this.st==='walk'){this.activeSheet='walk';this.sprFrame=Math.floor(this.fr/5)%P1_WALK_N;}
    else{this.activeSheet='idle';this.sprFrame=Math.floor(this.fr/8)%P1_IDLE_N;}
    if(!this.onGnd){this.vy+=0.72;this.y+=this.vy;}
    if(this.y>=GY){if(!this.onGnd)sfx.land();this.y=GY;this.vy=0;this.onGnd=true;if(this.st==='jump')this.st='idle';}
    this.x=Math.max(60,Math.min(WORLD_W-60,this.x));
  }
  atkBox(){
    if(this.hitDone)return null;const d=this.dir;
    if(this.st==='kick'&&this.fr>=12&&this.fr<=28)return{x:this.x+d*30,y:this.y-KICK_DH*0.55,w:d*KICK_DW*0.45,h:KICK_DH*0.35,dmg:14+(Math.random()*6|0)};
    if(this.st==='swing'&&this.fr>=22&&this.fr<=38)return{x:this.x+d*20,y:this.y-SWING_DH*0.85,w:d*SWING_DW*0.7,h:SWING_DH*0.6,dmg:20+(Math.random()*8|0)};
    return null;
  }
  hurtBox(){return{x:this.x-KICK_DW*0.22,y:this.y-KICK_DH*0.95,w:KICK_DW*0.44,h:KICK_DH*0.93};}
  hit(dmg){const blk=this.st==='block',actual=blk?Math.max(1,dmg>>3):dmg;this.hp=Math.max(0,this.hp-actual);this.flash=9;if(!blk){this.st='hurt';this.stTimer=18;this.fr=0;}if(this.hp===0){this.st='dead';this.stTimer=9999;}return{actual,blk};}
  draw(){
    let sheet,ready,fw,fh,dh,dw;
    if(this.activeSheet==='swing'){sheet=swingSheet;ready=swingReady;fw=SWING_FW;fh=SWING_FH;dh=SWING_DH;dw=SWING_DW;}
    else if(this.activeSheet==='kick'){sheet=kickSheet;ready=kickReady;fw=KICK_FW;fh=KICK_FH;dh=KICK_DH;dw=KICK_DW;}
    else if(this.activeSheet==='block'){sheet=p1BlockSheet;ready=p1BlockReady;fw=P1_BLOCK_FW;fh=P1_BLOCK_FH;dh=P1_BLOCK_DH;dw=P1_BLOCK_DW;}
    else if(this.activeSheet==='walk'){sheet=p1WalkSheet;ready=p1WalkReady;fw=P1_WALK_FW;fh=P1_WALK_FH;dh=P1_WALK_DH;dw=P1_WALK_DW;}
    else{sheet=p1IdleSheet;ready=p1IdleReady;fw=P1_IDLE_FW;fh=P1_IDLE_FH;dh=P1_IDLE_DH;dw=P1_IDLE_DW;}
    if(!ready)return;
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(this.x,this.y-2,48,11,0,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(this.x-dw/2,this.y-dh);
    if(this.dir===-1){ctx.translate(dw,0);ctx.scale(-1,1);}
    if(this.flash>0&&(this.flash&1))ctx.filter='brightness(9) saturate(0)';
    ctx.drawImage(sheet,this.sprFrame*fw,0,fw,fh,0,0,dw,dh);
    ctx.restore();
  }
}

class P2Fighter {
  constructor(x){this.name='WHATA PITY';this.wins=0;this.pal={acc:'#f0e0a0'};this.reset(x);}
  reset(x){this.x=x;this.y=GY;this.vy=0;this.hp=100;this.st='idle';this.fr=0;this.stTimer=0;this.onGnd=true;this.hitDone=false;this.flash=0;this.dir=-1;this.aiCD=0;this.sprFrame=0;this.p3ActiveSheet='idle';}
  get locked(){return['punch','kick','hurt','dead'].includes(this.st);}
  act(inp,opp){
    this.fr++;if(this.flash>0)this.flash--;
    if(this.stTimer>0&&--this.stTimer===0&&this.st!=='dead'){this.st='idle';this.hitDone=false;}
    if(!this.locked){
      this.dir=(this.x<opp.x)?1:-1;this.st='idle';
      if(inp.punch){this.st='punch';this.stTimer=22;this.hitDone=false;this.fr=0;sfx.punch();}
      else if(inp.kick){this.st='kick';this.stTimer=28;this.hitDone=false;this.fr=0;sfx.cpuKick();}
      else if(inp.block&&this.onGnd){if(this.st!=='block')this.fr=0;this.st='block';}
      else{if(inp.left){this.x-=5;if(this.onGnd)this.st='walk';}if(inp.right){this.x+=5;if(this.onGnd)this.st='walk';}}
      if(inp.jump&&this.onGnd){this.vy=-17;this.onGnd=false;this.st='jump';sfx.jump();}
    }
    this.sprFrame=Math.floor(this.fr/8)%P2_N;
    if(!this.onGnd){this.vy+=0.72;this.y+=this.vy;}
    if(this.y>=GY){if(!this.onGnd)sfx.land();this.y=GY;this.vy=0;this.onGnd=true;if(this.st==='jump')this.st='idle';}
    this.x=Math.max(60,Math.min(WORLD_W-60,this.x));
  }
  atkBox(){
    if(this.hitDone)return null;const d=this.dir;
    if(this.st==='punch'&&this.fr>=5&&this.fr<=12)return{x:this.x+d*18,y:this.y-P2_DH*0.6,w:d*80,h:50,dmg:8+(Math.random()*5|0)};
    if(this.st==='kick'&&this.fr>=6&&this.fr<=16)return{x:this.x+d*20,y:this.y-P2_DH*0.45,w:d*90,h:55,dmg:12+(Math.random()*6|0)};
    return null;
  }
  hurtBox(){return{x:this.x-P2_DW*0.32,y:this.y-P2_DH*0.95,w:P2_DW*0.64,h:P2_DH*0.93};}
  hit(dmg){const blk=this.st==='block',actual=blk?Math.max(1,dmg>>3):dmg;this.hp=Math.max(0,this.hp-actual);this.flash=9;if(!blk){this.st='hurt';this.stTimer=18;this.fr=0;}if(this.hp===0){this.st='dead';this.stTimer=9999;}return{actual,blk};}
  draw(){
    if(!p2Ready)return;
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(this.x,this.y-2,48,11,0,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(this.x-P2_DW/2,this.y-P2_DH);
    if(this.dir===1){ctx.translate(P2_DW,0);ctx.scale(-1,1);}
    if(this.flash>0&&(this.flash&1))ctx.filter='brightness(9) saturate(0)';
    if(this.st==='dead'){const dt=Math.min(1,this.fr/25);ctx.translate(P2_DW/2,P2_DH);ctx.rotate(dt*1.4);ctx.translate(-P2_DW/2,-P2_DH);}
    ctx.drawImage(p2Sheet,this.sprFrame*P2_FW,0,P2_FW,P2_FH,0,0,P2_DW,P2_DH);
    ctx.restore();
  }
}


class P3Fighter {
  constructor(x){this.name='DON COVFEFE';this.wins=0;this.pal={acc:'#cc2200'};this.p3ActiveSheet='idle';this.reset(x);}
  reset(x){this.x=x;this.y=GY;this.vy=0;this.hp=100;this.st='idle';this.fr=0;this.stTimer=0;this.onGnd=true;this.hitDone=false;this.flash=0;this.dir=-1;this.aiCD=0;this.sprFrame=0;this.p3ActiveSheet='idle';}
  get locked(){return['punch','kick','hurt','dead'].includes(this.st);}
  act(inp,opp){
    this.fr++;if(this.flash>0)this.flash--;
    if(this.stTimer>0&&--this.stTimer===0&&this.st!=='dead'){this.st='idle';this.hitDone=false;}
    if(!this.locked){
      this.dir=(this.x<opp.x)?1:-1;this.st='idle';
      if(inp.punch){this.st='punch';this.stTimer=22;this.hitDone=false;this.fr=0;sfx.punch();}
      else if(inp.kick){this.st='kick';this.stTimer=28;this.hitDone=false;this.fr=0;sfx.cpuKick();}
      else if(inp.block&&this.onGnd)this.st='block';
      else{if(inp.left){this.x-=5;if(this.onGnd)this.st='walk';}if(inp.right){this.x+=5;if(this.onGnd)this.st='walk';}}
      if(inp.jump&&this.onGnd){this.vy=-17;this.onGnd=false;this.st='jump';sfx.jump();}
    }
    if(this.st==='kick'){this.p3ActiveSheet='kick';this.sprFrame=Math.min(P3_KICK_N-1,Math.floor(this.fr/6));}
    else if(this.st==='walk'){this.p3ActiveSheet='walk';this.sprFrame=Math.floor(this.fr/5)%P3_WALK_N;}
    else{this.p3ActiveSheet='idle';this.sprFrame=Math.floor(this.fr/8)%P3_N;}
    if(!this.onGnd){this.vy+=0.72;this.y+=this.vy;}
    if(this.y>=GY){if(!this.onGnd)sfx.land();this.y=GY;this.vy=0;this.onGnd=true;if(this.st==='jump')this.st='idle';}
    this.x=Math.max(60,Math.min(WORLD_W-60,this.x));
  }
  atkBox(){
    if(this.hitDone)return null;const d=this.dir;
    if(this.st==='punch'&&this.fr>=5&&this.fr<=12)return{x:this.x+d*20,y:this.y-P3_DH*0.6,w:d*85,h:55,dmg:9+(Math.random()*5|0)};
    if(this.st==='kick'&&this.fr>=12&&this.fr<=28)return{x:this.x+d*30,y:this.y-P3_KICK_DH*0.55,w:d*P3_KICK_DW*0.5,h:P3_KICK_DH*0.35,dmg:14+(Math.random()*6|0)};
    return null;
  }
  hurtBox(){const dw=this.p3ActiveSheet==='walk'?P3_WALK_DW:P3_DW,dh=this.p3ActiveSheet==='walk'?P3_WALK_DH:P3_DH;return{x:this.x-dw*0.32,y:this.y-dh*0.95,w:dw*0.64,h:dh*0.93};}
  hit(dmg){
    const blk=this.st==='block',actual=blk?Math.max(1,dmg>>3):dmg;
    this.hp=Math.max(0,this.hp-actual);this.flash=9;
    if(!blk){this.st='hurt';this.stTimer=18;this.fr=0;}
    if(this.hp===0){this.st='dead';this.stTimer=9999;}
    return{actual,blk};
  }
  draw(){
    if(!p3Ready&&!p3WalkReady&&!p3KickReady)return;
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(this.x,this.y-2,48,11,0,0,Math.PI*2);ctx.fill();
    ctx.save();
    const p3CurDW=this.p3ActiveSheet==='walk'?P3_WALK_DW:this.p3ActiveSheet==='kick'?P3_KICK_DW:P3_DW;
    const p3CurDH=this.p3ActiveSheet==='walk'?P3_WALK_DH:this.p3ActiveSheet==='kick'?P3_KICK_DH:P3_DH;
    ctx.translate(this.x-p3CurDW/2,this.y-p3CurDH);

function hits(a,b){const ax1=Math.min(a.x,a.x+a.w),ax2=Math.max(a.x,a.x+a.w),bx1=Math.min(b.x,b.x+b.w),bx2=Math.max(b.x,b.x+b.w);return ax1<bx2&&ax2>bx1&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function aiThink(ai,plr){
  const inp={};
  if(!ai.locked||ai.st==='block'){
    ai.aiCD=Math.max(0,ai.aiCD-1);const dist=Math.abs(ai.x-plr.x);
    if(dist>140)inp[ai.x<plr.x?'right':'left']=true;
    else if(dist<55)inp[ai.x<plr.x?'left':'right']=true;
    if(ai.aiCD===0&&dist<160){const r=Math.random();if(r<0.32){inp.punch=true;ai.aiCD=28;}else if(r<0.58){inp.kick=true;ai.aiCD=38;}else if(r<0.68){inp.jump=true;ai.aiCD=32;}else ai.aiCD=20;}
  }

}

// Helper: get sprite data for a character index
function getCharDrawData(idx, t) {
  const data = [
    { sheet:p1IdleSheet, fw:P1_IDLE_FW, fh:P1_IDLE_FH, n:P1_IDLE_N, ready:p1IdleReady },
    { sheet:p2Sheet,     fw:P2_FW,       fh:P2_FH,       n:P2_N,       ready:p2Ready     },
    { sheet:p3Sheet,     fw:P3_FW,       fh:P3_FH,       n:P3_N,       ready:p3Ready     },
  ][idx] || { ready:false };
  const previewH=220;
  const dw=Math.round(previewH*(data.fw/data.fh));
  return { ...data, frame:Math.floor(t/8)%(data.n||1), dh:previewH, dw };
}


function startRound(){stopBgMusic();cameraX=0;p1.reset(210);p2.reset(590);gTimer=99;gTimerMs=0;gPhase='intro';gTransPending=false;parts=[];floats=[];announce(`ROUND ${gRound}`);setTimeout(()=>{announce('FIGHT!');sfx.fight();gPhase='fight';},1500);}
function endRound(timeOut=false){
  if(gPhase==='title'){updateTitle();return;}
  if(gPhase==='charselect'){updateCharSelect();return;} if(gPhase!=='fight')return;gPhase='roundEnd';let winner=null;
  if(!timeOut){winner=p1.hp<=0?p2:p1;sfx.ko();}else{if(p1.hp>p2.hp)winner=p1;else if(p2.hp>p1.hp)winner=p2;}
  if(winner){winner.wins++;sfx.win();}
  announce(timeOut?(winner?`TIME!\n${winner.name} WINS!`:'TIME!\nDRAW!'):`K.O.\n${winner.name} WINS!`,200);
  if(!gTransPending){gTransPending=true;setTimeout(()=>{if(p1.wins>=2||p2.wins>=2){gPhase='gameover';announce(`${p1.wins>=2?p1.name:p2.name}\nVICTORY!`,9999);}else{gRound++;startRound();}},3200);}
}
function rematch(){p1.wins=0;p2.wins=0;gRound=1;gPhase='title';gAnnTimer=0;gTransPending=false;gSelConfirmed=false;gSelTimer=0;gSelPulse=0;gSelIdx=0;gTitleMusicStarted=false;p1=new P1Fighter(210);p2=new P2Fighter(590);setTimeout(startBgMusic,300);}

p1=new P1Fighter(210); p2=new P2Fighter(590); gRound=1; gPhase='title'; gSelIdx=0;

function update(){
  gShakeX*=0.58;gShakeY*=0.58;if(Math.abs(gShakeX)<0.3)gShakeX=0;if(Math.abs(gShakeY)<0.3)gShakeY=0;
  if(gAnnTimer>0)gAnnTimer--;updateParts();updateFloats();
  if(gPhase==='title'){updateTitle();return;}
  if(gPhase==='charselect'){updateCharSelect();return;} if(gPhase!=='fight')return;
  gTimerMs+=16.67;if(gTimerMs>=1000){gTimerMs=0;if(gTimer===10)sfx.tick();if(--gTimer<=0){endRound(true);return;}}
  const pi=p1Input(),ai=aiThink(p2,p1);p1.act(pi,p2);p2.act(ai,p1);
  // Camera: follow midpoint between fighters, clamp to world bounds
  const midX=(p1.x+p2.x)/2;
  cameraX=Math.max(0,Math.min(WORLD_W-800,midX-400));
  const dx=p1.x-p2.x;if(Math.abs(dx)<90){const sep=(90-Math.abs(dx))*0.5*Math.sign(dx||1);p1.x=Math.max(60,Math.min(WORLD_W-60,p1.x+sep));p2.x=Math.max(60,Math.min(WORLD_W-60,p2.x-sep));}
  const ab1=p1.atkBox(),hb2=p2.hurtBox(),ab2=p2.atkBox(),hb1=p1.hurtBox();
  if(ab1&&hits(ab1,hb2)){const r=p2.hit(ab1.dmg);p1.hitDone=true;gShakeX=r.blk?2:10;gShakeY=r.blk?1:6;spawnHit(p2.x,p2.y-80,r.blk);addFloat(p2.x,p2.y-165,r.blk?'BLOCKED':`-${r.actual}${p1.st==='swing'?' ⛳':' 🦵'}`,r.blk?'#8899ff':p1.st==='swing'?'#ffcc00':'#ff6600');r.blk?sfx.block():(p1.st==='swing'?sfx.swing():(sfx.kick(),playPunchSFX()));}
  if(ab2&&hits(ab2,hb1)){const r=p1.hit(ab2.dmg);p2.hitDone=true;gShakeX=r.blk?-2:-7;gShakeY=r.blk?1:4;spawnHit(p1.x,p1.y-80,r.blk);addFloat(p1.x,p1.y-165,r.blk?'BLOCKED':`-${r.actual} 🥃`,r.blk?'#8899ff':'#f0e0a0');r.blk?sfx.block():(sfx.punch(),playPunchSFX());}
  if((p1.hp<=0||p2.hp<=0)&&gPhase==='fight')endRound(false);
}
function render(){
  ctx.save();
  if(gShakeX||gShakeY)ctx.translate(gShakeX|0,gShakeY|0);
  drawScene();
  if(gPhase!=='charselect'&&gPhase!=='title'){
    // Apply camera offset for world-space elements
    ctx.save();
    ctx.translate(-cameraX,0);
    p1.draw();
    p2.draw();
    // Draw particles in world space
    drawPartsWorld();
    ctx.restore();
  }
  ctx.restore();
  if(gPhase==='title')drawTitle();else if(gPhase==='charselect')drawCharSelect();else drawHUD();
}
function loop(){update();render();requestAnimationFrame(loop);}
loop();  // charselect phase starts automatically
</script>
